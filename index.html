<!doctype html>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#150f0b" />
    <!-- Safari no iOS não lê o manifest.icons pra ícone da tela de início —
         só este link (padrão desde sempre no iOS, diferente do resto). Sem
         isso, "Adicionar à Tela de Início" usa um print da página como
         ícone. apple-mobile-web-app-capable é o que faz abrir em tela cheia
         (sem a barra do Safari) depois de instalado, imitando o
         display: standalone do manifest (que o iOS ainda não segue). -->
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Abz Gestão" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
